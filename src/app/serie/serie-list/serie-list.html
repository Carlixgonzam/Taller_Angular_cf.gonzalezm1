<div class="container-xxl my-4">
    <h2 class="mb-3">Lista de series</h2>
  
    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle w-100">
        <thead class="table-dark">
          <tr>
            <th scope="col">Id</th>
            <th scope="col">Name</th>
            <th scope="col">Channel</th>
            <th scope="col">Seasons</th>
          </tr>
        </thead>
  
        <tbody>
            <tr *ngFor="let c of series">
                <td>{{ c.id }}</td>
                <td>
                  <a href="#" (click)="selectSerie(c); $event.preventDefault()" class="link-primary text-decoration-underline">
                    {{ c.name }}
                  </a>
                </td>
                <td>{{ c.channel }}</td>
                <td>{{ c.seasons }}</td>
              </tr>
        </tbody>
      </table>
      <div class="row mt-4" *ngIf="selectedSerie as s">
        <div class="col-md-4 mb-3">
          <img
            [src]="s.poster"
            [alt]="s.name + ' poster'"
            class="img-fluid img-thumbnail"
            referrerpolicy="no-referrer"
            loading="lazy"
            decoding="async"
          />
        </div>
        <div class="col-md-8">
          <h3 class="h4">{{ s.name }}</h3>
          <p class="mb-3">{{ s.description }}</p>
          <a
            [attr.href]="s.webpage"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn-primary btn-sm"
          >
            Ir a la página oficial
          </a>
        </div>
      </div>
    </div>
  
    <p class="fw-bold text-end mt-2">Seasons average: {{ averageSeasons }}</p>
  </div>
